name: Giveaway Check Every 30 Minutes

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: rblx-giveaway
  cancel-in-progress: false

jobs:
  join-giveaway:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run giveaway check
        run: python join_giveaway.py
